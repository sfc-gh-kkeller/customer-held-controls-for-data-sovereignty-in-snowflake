<h2 id="the-question-behind-every-option">The question behind every option</h2>
<p><strong>&quot;Who can turn the data off – and can the platform ever see it in clear?&quot;</strong></p>
<p>Most data can live natively in Snowflake with standard governance. For a small set of<br />
highly regulated data, customers sometimes ask for a stronger guarantee:</p>
<ul>
<li>the data must <strong>not be stored</strong> in a foreign cloud at all, or</li>
<li>it may be stored, but only <strong>encrypted with a key the customer holds</strong>, or</li>
<li>the platform may compute on it, but must <strong>never see a plaintext value</strong></li>
</ul>
<p>These options are not a replacement for Snowflake's native security (Tri-Secret Secure,<br />
masking, row access policies, private connectivity). They are <strong>additional patterns</strong> for the<br />
few datasets where the customer wants the switch in their own hands.</p>
<footer>Customer-held controls for data sovereignty · demo on Snowflake + on-prem + AWS</footer>

<h2 id="the-options-at-a-glance">The options at a glance</h2>
<table>
<thead>
<tr>
<th></th>
<th>Where the sensitive data lives</th>
<th>Who holds the switch</th>
<th>Snowflake sees plaintext</th>
<th>Snowflake UX kept</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1 Tunnel</strong></td>
<td>on-prem Iceberg lake</td>
<td>data owner: tunnel on/off, TTL</td>
<td>only during a query while the tunnel is up</td>
<td>yes</td>
</tr>
<tr>
<td><strong>2 Key broker</strong></td>
<td>Snowflake, AES-256-GCM ciphertext</td>
<td>data owner: KMS + broker in own AWS</td>
<td>only during a RUNNING query of a stepped-up user</td>
<td>yes, via masking policy</td>
</tr>
<tr>
<td><strong>2b EAI key fetch</strong></td>
<td>Snowflake, AES-256-GCM ciphertext</td>
<td>data owner: vault authorizes the integration</td>
<td>only during a query (key memo per query)</td>
<td>yes, via masking policy / view</td>
</tr>
<tr>
<td><strong>2c Device-flow key</strong></td>
<td>Snowflake, AES-256-GCM ciphertext</td>
<td>data owner: IdP approval + broker checks the running query</td>
<td>only during a running query, in the approved session</td>
<td>yes, via SQL function</td>
</tr>
<tr>
<td><strong>2d Remote decrypt</strong></td>
<td>Snowflake, AES-256-GCM ciphertext; key only in AWS</td>
<td>data owner: as 2c, broker decrypts in AWS</td>
<td>plaintext (never the key) during a running query, in the approved session</td>
<td>yes, via SQL function</td>
</tr>
<tr>
<td><strong>3 Local join</strong></td>
<td>on-prem only</td>
<td>data owner – data never leaves</td>
<td>never</td>
<td>no (local notebook)</td>
</tr>
<tr>
<td><strong>4 Client decrypt</strong></td>
<td>Snowflake, AES-256 ciphertext</td>
<td>data owner: key only in on-prem app</td>
<td>never</td>
<td>no (on-prem app)</td>
</tr>
<tr>
<td><strong>HE bonus</strong></td>
<td>Snowflake, homomorphic ciphertext</td>
<td>data owner: secret key stays local</td>
<td>never</td>
<td>partly (encrypted aggregates)</td>
</tr>
</tbody>

<h2 id="option-1-%E2%80%93-how-it-works">Option 1 – How it works</h2>
<ol>
<li>The data owner runs <code>tunnel-up --ttl 15m --reason &quot;…&quot;</code> – resumes the SPCS service if needed and<br />
starts the on-prem agent. Every open/close is written to an on-prem audit log.</li>
<li>The agent opens an <strong>outbound</strong> WebSocket to the SPCS sidecar (PAT → OAuth, RSA + AES session).<br />
No inbound firewall ports.</li>
<li>Analysts query <code>EMPLOYEES_SENSITIVE_LIVE</code> – a secure view over <code>QUERY_ONPREM()</code>, which proxies to<br />
DuckDB reading the Iceberg tables on-prem.</li>
<li><code>VOLATILE</code> + <code>UUID_STRING()</code> nonce: every query goes through the tunnel; there is no result cache hit.</li>
<li>TTL expires or <code>tunnel-down</code> → the next query returns no data (the view is empty; the function returns the agent's connection error as a value). Nothing to delete in Snowflake.</li>
</ol>
<p class="small">Verified: join of Snowflake public data + on-prem sensitive data, 200 rows; four identical runs, never cached; after tunnel-down: no data (0 rows, connection error returned as a value).</p>
<footer>Customer-held controls for data sovereignty · demo on Snowflake + on-prem + AWS</footer>
</section>

<h2 id="option-1-%E2%80%93-pros-and-cons">Option 1 – Pros and cons</h2>
<div class="cols">
<div class="pro">
<h3 id="pros">Pros</h3>
<ul>
<li>Sensitive data is <strong>never persisted</strong> in Snowflake</li>
<li>Data owner has a physical <strong>kill switch</strong> with TTL and audit trail</li>
<li>Full Snowflake UX: SQL, views, joins with native data, notebooks</li>
<li>No inbound ports – agent dials out</li>
<li>No result-cache exposure by design</li>
</ul>
</div>
<div class="con">
<h3 id="cons">Cons</h3>
<ul>
<li>Throughput bound by the network and the on-prem host; best for bounded queries, not full scans</li>

<li>While the tunnel is up, plaintext exists in query memory</li>
<li>Availability depends on the on-prem side</li>
</ul>
</div>
</div>

<h2 id="option-1b-%E2%80%93-notebook-and-own-query-engine-through-the-tunnel">Option 1b – Notebook and own query engine through the tunnel</h2>
<p>A Snowflake Notebook or a custom notebook on SPCS (Jupyter, marimo) queries through the tunnel with <strong>DuckDB</strong>,<br />
bypassing Snowflake's query engine: <strong>no query result, no result cache, nothing to <code>RESULT_SCAN</code></strong>.</p>
<div class="cols">
<div class="pro">
<h3 id="gained">Gained</h3>
<ul>
<li>Nothing about the sensitive data is stored in Snowflake, not even a cached result</li>
<li>The Snowflake experience is kept with Snowflake Notebooks</li>
<li>Any engine: DuckDB, PyIceberg, Polars …</li>
</ul>
</div>
<div class="con">
<h3 id="lost">Lost</h3>
<ul>
<li>The compute power of Snowflake's query engine: one notebook container does the work</li>
<li>On-demand elasticity (warehouse scaling, multi-cluster)</li>
<li>Snowflake governance on this data path</li>
</ul>
</div>
</div>
<p><strong>Not in the demo yet: passing the user's identity through to the on-prem source</strong> (e.g. an Iceberg catalog). Options:<br />
out of band, a device-code token from an external identity provider started from the notebook (as in 2c), or a proof<br />
of the Snowflake identity taken from the user context or notebook secrets. One Iceberg pattern is planned.</p>
<footer>Customer-held controls for data sovereignty · demo on Snowflake + on-prem + AWS</footer>

<h2 id="option-2-%E2%80%93-in-plain-words">Option 2 – In plain words</h2>
<div class="plain">
<p>Like a <strong>bank safe-deposit box</strong>: the box sits in Snowflake's vault, but the key sits in <em>your</em> key safe. Every time someone wants to open it, your gatekeeper checks who they are and why – and lends the key for that one moment only.</p>
</div>
<div class="simple3">
<div>
<h3 id="where-is-the-data-1">Where is the data?</h3>
<p>In Snowflake, locked. Unreadable without your key.</p>
</div>
<div>
<h3 id="who-decides-1">Who decides?</h3>
<p>Your gatekeeper in your AWS account: phone code + reason, time-limited, every release logged.</p>
</div>
<div>
<h3 id="good-for-1">Good for</h3>
<p>Sensitive columns (names, IDs, salaries) that should stay in Snowflake and be <strong>used normally</strong> – by approved people only.</p>
</div>
</div>
<p><strong>Catch:</strong> while an approved query runs, the data is readable in Snowflake for that moment; a few extra seconds per query.</p>

<h2 id="option-2-%E2%80%93-how-it-works">Option 2 – How it works</h2>
<ol>
<li>Columns are encrypted <strong>before load</strong> (AES-256-GCM, data key from KMS); Snowflake stores ciphertext<br />
and never holds the KMS key.</li>
<li>A masking policy calls <code>SOV_DECRYPT(value, SOV_GET_KEY('salary'))</code> – an <strong>IMMUTABLE</strong><br />
external function, so the key is fetched about once per query, not per row.</li>
<li>The broker checks: valid step-up grant (TOTP + written justification, time-boxed)? Then it calls back<br />
into Snowflake: is <strong>this query_id RUNNING</strong> for this user, role and account?</li>
<li>Only then is the data key unwrapped by KMS and returned. Finished query_ids are refused (replay protection).</li>
</ol>
<table>
<thead>
<tr>
<th>Role / state</th>
<th>Result</th>
</tr>
</thead>
<tbody>
<tr>
<td>Viewer</td>
<td><code>**ENCRYPTED**</code> – policy never asks for a key</td>
</tr>
<tr>
<td>Analyst, no step-up</td>
<td><code>**KEY DENIED**</code></td>
</tr>
<tr>
<td>Analyst after step-up</td>
<td>plaintext, aggregates in Snowflake – identical to Option 1</td>
</tr>
<tr>
<td>Grant expired / revoked</td>
<td><code>**KEY DENIED**</code> again</td>
</tr>
</tbody>
</table>
<footer>Customer-held controls for data sovereignty · demo on Snowflake + on-prem + AWS</footer>
</section>

<h2 id="option-2-%E2%80%93-pros-and-cons">Option 2 – Pros and cons</h2>
<div class="cols">
<div class="pro">
<h3 id="pros-1">Pros</h3>
<ul>
<li>Data stays in Snowflake – storage, sharing, backup, performance unchanged</li>
<li><strong>Transparent</strong> for authorized users: normal SQL, BI, notebooks</li>
<li>Key and decision live in the <strong>customer's</strong> AWS account; every release is audited with justification</li>
<li>Step-up and time-boxing per classification (salary, PII …)</li>
<li>Replay-proof: key only for a currently running query</li>
<li>Fails closed on any error</li>
</ul>
</div>
<div class="con">
<h3 id="cons-1">Cons</h3>
<ul>
<li>While a query runs, the key and plaintext exist in Snowflake compute memory</li>
<li>An authorized user can still copy what they see (CTAS, export) – could be reduced with additional controls</li>
<li>Latency: about 4 s per decrypting query (plaintext 0.1 s), incl. the RUNNING call-back</li>
<li>AWS stack to operate: KMS, Lambda, API Gateway, DynamoDB, API integration</li>
<li>Encrypted columns can't be filtered or joined on without decryption</li>
</ul>
</div>
</div>
<footer>Customer-held controls for data sovereignty · demo on Snowflake + on-prem + AWS</footer>
</section>

<h2 id="option-2b-%E2%80%93-in-plain-words">Option 2b – In plain words</h2>
<div class="plain">
<p>Like a <strong>contractor who borrows your key for one job</strong>: they collect it from your key safe when the job starts, use it for every room, and give it back when the job is done. The next job means collecting it again.</p>
</div>
<div class="simple3">
<div>
<h3 id="where-is-the-data-2">Where is the data?</h3>
<p>In Snowflake, locked – same as Option 2.</p>
</div>
<div>
<h3 id="who-decides-2">Who decides?</h3>
<p>Your key safe decides whether Snowflake's integration may fetch the key; Snowflake roles decide who may run the query.</p>
</div>
<div>
<h3 id="good-for-2">Good for</h3>
<p>Teams that want &quot;key stays with us&quot; with <strong>minimal extra infrastructure</strong> – any vault, even over a private link.</p>
</div>
</div>
<p><strong>Catch:</strong> your key safe sees &quot;Snowflake&quot;, not which analyst or query – no phone step-up unless added on top.</p>
<footer>Customer-held controls for data sovereignty · demo on Snowflake + on-prem + AWS</footer>

<h2 id="option-2b-%E2%80%93-pros-and-cons">Option 2b – Pros and cons</h2>
<div class="cols">
<div class="pro">
<h3 id="pros-2">Pros</h3>
<ul>
<li>Far less to run: network rule, secret / OAuth, External Access Integration – no Lambda, API Gateway, DynamoDB</li>
<li>Works with any HTTPS key service, including outbound PrivateLink</li>
<li>Key only in UDF memory for one query (as measured); never stored in Snowflake</li>
<li>One fetch per process per query; native AES-GCM decryption in SQL</li>
<li>Kill switch: disable the integration or revoke the token</li>
</ul>
</div>
<div class="con">
<h3 id="cons-2">Cons</h3>
<ul>
<li>Key service authorizes the <strong>integration</strong>, not the analyst or query – unless the UDF passes user, role and query ID itself</li>
<li>No step-up or replay protection out of the box (Option 2 has both)</li>
<li>Authorization relies on Snowflake RBAC on the UDF / masking policy</li>
<li>Key exists in compute memory during the query (as in Option 2)</li>
<li>Process lifetime is platform behaviour, not a contract</li>
</ul>
</div>
</div>
<footer>Customer-held controls for data sovereignty · demo on Snowflake + on-prem + AWS</footer>
</section>

<div>

<table>
<thead>
<tr>

<tr>

<td><strong>15/15</strong></td>
<td>8/15 (bound to the previous query)</td>
</tr>
<tr>
<td>Forged or finished query id</td>
<td>denied</td>
<td>n/a</td>
</tr>
<tr>

<td>denied</td>

<td>1</td>

<h2 id="option-2c-%E2%80%93-pros-and-cons">Option 2c – Pros and cons</h2>
<div class="cols">
<div class="pro">
<h3 id="pros-3">Pros</h3>
<ul>
<li>MFA approval with a written justification, per session, on a second device</li>
<li>API key only valid for that user, account and session – stored only as a hash</li>
<li>Every key release bound to an exact running query id, one audit line per query</li>
<li>No API Gateway or API integration; PrivateLink possible</li>
<li>Wrong scope or classification refused without touching Snowflake</li>
</ul>
</div>
<div class="con">
<h3 id="cons-3">Cons</h3>
<ul>
<li>Sign-in service and key service to operate (mock IdP here; Okta or Entra in practice)</li>
<li>About 0.3 s extra per query for the call-back</li>
<li>Self-id pattern is observed behaviour; owner's-rights procedures can't use it</li>
<li>API key sits in a session variable, visible to the same user</li>
<li>Key in compute memory during the query (as in 2 and 2b)</li>
</ul>
</div>
</div>
<footer>Customer-held controls for data sovereignty · demo on Snowflake + on-prem + AWS</footer>

<h2 id="option-2d-%E2%80%93-remote-decrypt-the-key-never-enters-snowflake">Option 2d – Remote decrypt: the key never enters Snowflake</h2>
<p>Same phone approval, API key and query binding as 2c – but the broker <strong>never hands out the key</strong>.<br />
A vectorized UDF sends batches of ciphertext (up to 2,000 values); the broker decrypts in AWS and returns plaintext.<br />
Also the shape for external <strong>de-tokenization</strong>.</p>
<div class="cols">
<div class="pro">
<h3 id="pros-4">Pros</h3>
<ul>
<li>No data key in Snowflake, not even in query memory</li>
<li>Broker logs every batch: user, query id, classification, rows, failures</li>
<li>Strict variant raises instead of returning NULL – safe for CTAS and Dynamic Tables</li>
</ul>
</div>
<div class="con">
<h3 id="cons-4">Cons</h3>
<ul>
<li>Plaintext crosses the network on the way back (TLS; PrivateLink possible)</li>
<li>Cost grows with rows – one call per batch</li>
<li>Same observed-behaviour caveat as 2c</li>
</ul>
</div>
</div>
<p class="small">Key custody ≠ data custody: decrypting upstream before loading also keeps the key out of Snowflake, but puts plaintext in Snowflake from the first table on.</p>
<footer>Customer-held controls for data sovereignty · demo on Snowflake + on-prem + AWS</footer>

<h2 id="option-4-%E2%80%93-pros-and-cons">Option 4 – Pros and cons</h2>
<div class="cols">
<div class="pro">
<h3 id="pros-6">Pros</h3>
<ul>
<li><strong>No key ever enters Snowflake</strong> – not even transiently</li>
<li>Data is still stored, backed up and shareable in Snowflake</li>
<li>Snowflake can filter and group on the plaintext dimensions</li>
<li>One app plus key handling – low operating effort</li>
<li>Plaintext lives only in a per-session, in-memory cache with TTL</li>
</ul>
</div>
<div class="con">
<h3 id="cons-6">Cons</h3>
<ul>
<li>No Snowflake UX on decrypted data: Snowsight and Cortex see ciphertext</li>
<li>No pushdown on encrypted columns – data is pulled and computed locally; suits departmental volumes</li>
<li>AES-CBC as built has no integrity check; AES-GCM could detect tampering</li>
<li>The key sits on the app host; an HSM / KMS / Vault fetch could replace that</li>
</ul>
</div>
</div>

<h2 id="trade-offs-side-by-side">Trade-offs side by side</h2>

<th></th>

<tr>
<td><strong>Performance</strong></td>
<td>network-bound</td>
<td>~4 s per query</td>
<td>local host</td>
<td>pull + decrypt locally</td>
<td>heavy</td>
</tr>
<tr>
<td><strong>Operating effort</strong></td>
<td>SPCS + agent + lake</td>

<td>lowest</td>
<td>one app + key</td>
<td>moderate</td>

<td><strong>Snowflake governance on sensitive rows</strong></td>
